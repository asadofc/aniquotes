[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aniquotes"
version = "0.1.3"
description = "A lightweight Python package to generate and search 14,667 anime quotes from popular characters and shows."
readme = "README.md"
license = { text = "Unlicense" }
authors = [
    { name = "Asadul Islam", email = "mr.asadul.islam00@gmail.com" }
]
keywords = ["anime", "quotes", "anime-quotes", "otaku", "manga"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/asadofc/aniquotes"
Repository = "https://github.com/asadofc/aniquotes"

[tool.hatch.build.targets.wheel]
packages = ["aniquotes"]
core-metadata-version = "2.1"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.1"